{% extends "base.html" %}
{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}
{% block title %}Huellas a casa{% endblock %}
{% block content %}
<main>

    <div class="login-contenido">
        <form action="#" method="post" id="registro">
            <legend>Crear Cuenta</legend>

            <p>
                <label for="correo">Correo electrónico</label><br>
                <input type="email" id="correo" name="correo">
                <small id="error-correo"></small>
            </p>

            <p>
                <label for="nombre">Nombre</label><br>
                <input type="text" id="nombre" name="nombre">
                <small id="error-nombre"></small>
            </p>

            <p>
                <label for="apellido">Apellido</label><br>
                <input type="text" id="apellido" name="apellido">
                <small id="error-apellido"></small>
            </p>

            <p>
                <label for="telefono">Número de teléfono</label><br>
                <input type="tel" id="telefono" name="telefono">
                <small id="error-telefono"></small>
            </p>

            <p>
                <label for="fecha-nacimiento">Fecha de nacimiento</label><br>
                <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">
                <small id="error-fecha-nacimiento"></small>
            </p>

            <p>
                <label for="dni">DNI</label><br>
                <input type="number" id="dni" name="dni">
                <small id="error-dni"></small>
            </p>

            <p>
                <label for="contraseña">Contraseña</label><br>
                <input type="password" id="contraseña" name="contraseña">
                <small id="error-contraseña"></small>
            </p>

            <button type="submit">Registrarse</button>
            <p id="mensaje-formulario" aria-live="polite"></p>
        </form>

        <a href="{{ url_for('login') }}" class="boton-regis">Iniciar sesión</a>
    </div>

</main>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/registro.js') }}"></script>
{% endblock %}
