{% extends "base_admin.html" %}
{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/formulario_donar_admin.css') }}">
{% endblock %}
{% block title %}Huellas a casa{% endblock %}
{% block content %}
<main>
    <!-- cada tarjeta es un animal-->
    {% for donacion in donaciones %}
    <div class="tarjetas">
        <div class="contenido">
            <!-- aca se agrupan todos los datos-->
            <div class="informacion">
                <!-- informacion del animal-->
                <img src="url_for('static', filename='{{donacion['ruta_img']}}')" alt="Foto de perfil del donante">
                <div class="datos">
                    <h1>Donacion: ${{ donacion['monto'] }}</h1>
                    <p>{{ donacion['nombre'] }} {{ donacion['apellido'] }}</p>
                </div>
            </div>
            <!-- aca van los botones de accion-->
            <div class="botones">
                <!-- aca van en columna-->
                <a href="{{ url_for('formulario_donar_respondido_admin', donacion_id=donacion['id']) }}">
                    <button class="boton_adopcion ver">
                        Ver formulario
                    </button>
                </a>
                <div class="eleccion">
                    <!-- los separo para ponerlos en fila-->
                    <button class="boton_adopcion aceptar">Recibido</button>
                    <button class="boton_adopcion rechazar">No recibido</button>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</main>
{% endblock %}
