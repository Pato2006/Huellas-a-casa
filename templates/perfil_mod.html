{% extends "base.html" %}
{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/perfil.css') }}">
{% endblock %}
{% block title %}Huellas a casa{% endblock %}
{% block content %}
<main class="main-perfil">
    <h1>Modificar perfil</h1>

    <form class="perfil-caja" action="#" method="post" id="perfil-mod">
        <div class="perfil-columna-izquierda">
            <img src="{{ url_for('static', filename='img/perfil.svg') }}" alt="Foto de perfil" class="perfil-avatar">
            <label for="foto" class="boton-modificar">
                Cambiar foto
                <input type="file" id="foto" name="foto" accept="image/*" hidden>

            </label>
            <small id="error-foto"></small>
        </div>

        <div class="perfil-datos">
            <label for="nombre">
                <strong>Nombre:</strong>
                <input type="text" id="nombre" name="nombre" value="Nombre">
                <small id="error-nombre"></small>
            </label>

            <label for="apellido">
                <strong>Apellido:</strong>
                <input type="text" id="apellido" name="apellido" value="Apellido">
                <small id="error-apellido"></small>
            </label>

            <label for="email">
                <strong>Correo electrónico:</strong>
                <input type="email" id="correo" name="correo" value="...@gmail.com">
                <small id="error-correo"></small>
            </label>

            <label for="telefono">
                <strong>Número de teléfono:</strong>
                <input type="tel" id="telefono" name="telefono" value="11-1234-5678">
                <small id="error-telefono"></small>
            </label>

            <label for="fecha_nacimiento">
                <strong>Fecha de nacimiento:</strong>
                <input type="date" id="fecha-nacimiento" name="fecha_nacimiento" value="0001-01-01">
                <small id="error-fecha-nacimiento"></small>
            </label>

            <button type="submit" class="boton-guardar">Guardar cambios</button>
        </div>
    </form>
    <p id="mensaje-formulario" aria-live="polite"></p>
</main>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/perfil_mod.js') }}"></script>
{% endblock %}
