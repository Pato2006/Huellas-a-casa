{% extends "base.html" %}
{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/perfil.css') }}">
{% endblock %}
{% block title %}Huellas a casa{% endblock %}
{% block content %}
    <main class="main-perfil">
        <h1>Estado de donaciones</h1>

        <section class="adopciones">

            <article class="adopcion-caja">
                <div class="separador">
                    <img src="{{ url_for('static', filename='img/perfil.svg') }}" alt="Donación" class="adopcion-foto">
                    <p>$5.000</p>
                </div>

                <a href="{{ url_for('formulario_donar_respondido_usuario') }}" class="boton-formulario">
                    Ver formulario
                </a>

                <p class="estado-adopcion">
                    <strong>Estado:</strong> Recibido
                </p>
            </article>

            <article class="adopcion-caja">
                <div class="separador">
                    <img src="{{ url_for('static', filename='img/perfil.svg') }}" alt="Donación" class="adopcion-foto">
                    <p>$10.000</p>
                </div>

                <a href="{{ url_for('formulario_donar_respondido_usuario') }}" class="boton-formulario">
                    Ver formulario
                </a>

                <p class="estado-adopcion">
                    <strong>Estado:</strong> No recibido
                </p>
            </article>

            <article class="adopcion-caja">
                <div class="separador">
                    <img src="{{ url_for('static', filename='img/perfil.svg') }}" alt="Donación" class="adopcion-foto">
                    <p>$2.500</p>
                </div>

                <a href="{{ url_for('formulario_donar_respondido_usuario') }}" class="boton-formulario">
                    Ver formulario
                </a>

                <p class="estado-adopcion">
                    <strong>Estado:</strong> Recibido
                </p>
            </article>

        </section>
    </main>
{% endblock %}
