<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellas a casa</title>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/detalle_modificar.css">
</head>

<body>
    <header class="cabecera">
        <div class="cabecera-contenido">
            <a href="index.html"><img src="img/logo.svg" alt="Huellas a casa" id="logo"></a>
            <nav>
                <ul class="menu">
                    <!-- cambia las opciones del menu al ser admin-->
                    <li class="lista"><a href="catalogo.html">Catalogo</a></li>
                    <li class="lista"><a href="cargar_animales.html">Cargar animales</a></li>
                    <li class="lista"><a href="ver_formulario_adopcion_admin.html">Ver adopciones</a></li>
                    <li class="lista"><a href="formulario_donar_admin.html">Ver donaciones</a></li>
                    <li class="lista"><a href="perfil.html"><img src="img/perfil.svg" alt="Perfil" id="perfil"></a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <!-- contenedor que centra todo, puede o no usarse-->
    <main>
        <div class="informacion">
            <div class="div_detalle_iz">
                <img src="img/perro_adopcion_2.jpg" alt="foto del perro" class="foto_detalle">
                <input type="file" name="foto" id="foto" accept="image/*">
                <label for="foto" class="label_subir_foto">CARGAR FOTO</label>
            </div>
            <div class="div_detalle_dr">
                <form action="" method="" class="formulario fondo">
                    <fieldset class="contorno"> <!-- borde -->
                        <!-- comienzan las preguntas-->
                        <p>
                            <label for="nombre">Nombre</label><br>
                            <input type="text" name="nombre" required>
                        </p>
                        <p>
                            <label for="edad">Edad
                                ¿Cuales?</label><br>
                            <input type="text" name="edad" required>
                        </p>
                        <p>
                            <label for="peso">Peso</label><br>
                            <input type="text" name="peso" required>
                        </p>
                        <p>
                            <label for="personalidad">Personalidad</label><br>
                            <input type="text" name="personalidad" required>
                        </p>

                        <p>
                            <label for="descripcion">Descripcion</label><br>
                            <textarea name="descripcion" required></textarea>
                        </p>
                        <p>
                            <span>Tipo</span><br>
                            <input type="radio" name="tipo" value="" required>
                            <label for="perro">Perro</label>
                            <input type="radio" name="tipo" value="gato">
                            <label for="gato">Gato</label>
                        </p>
                        <!-- terminan las preguntas-->
                    </fieldset>
                    <!-- botones de accion-->
                    <button type="submit" class="boton-form">Enviar propuesta</button>
                    <button type="reset" class="boton-form">Limpiar formulario</button>
                </form>
            </div>
        </div>
    </main>
    <!-- main con un estilo general para que se vea-->
    <footer class="pie">
        <p>© 2026 Huellas a Casa | Refugio animal 🐾</p>
        <p>Cada huella merece encontrar un hogar.</p>
    </footer>
    <!-- footer con la informacion del refugio-->

</body>

</html>
