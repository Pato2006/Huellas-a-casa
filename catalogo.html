<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellas a casa</title>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/catalogo.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <header class="cabecera">
        <div class="cabecera-contenido">
            <a href="index.html"><img src="img/logo.svg" alt="Huellas a casa" id="logo"></a>
            <nav>
                <ul class="menu">
                    <li class="lista"><a href="catalogo.html">Adoptar</a></li>
                    <li class="lista"><a href="formulario_donar.html">Donar</a></li>
                    <li class="lista"><a href="contacto.html">Contactos</a></li>
                    <li class="lista"><a href="perfil.html"><img src="img/perfil.svg" alt="Perfil" id="perfil"></a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <!-- cabecera con el header y el nav general con todos los datos-->
    <main>
        <div class="catalogo">
            <div class="lateral_iz">
                <div class="filtros">
                    <h3>Filtros</h3>
                    <div class="filtro_fila">
                        <p>Nombre</p>
                        <div class="lista-catalogo">
                            <input type="text" id="nombre_animal" placeholder="Buscar por nombre">
                            <button id="buscar-nombre">Buscar</button>
                        </div>
                    </div>

                    <div class="filtro_fila">
                        <p>Tipo</p>
                        <div class="lista-catalogo">
                            <button id="gato">Gato</button>
                            <button id="perro">Perro</button>
                        </div>
                    </div>

                    <div class="filtro_fila">
                        <p>Edad</p>
                        <div class="lista-catalogo">
                            <button id="edad-0-4">0 - 4 años</button>
                            <button id="edad-4-8">4 - 8 años</button>
                            <button id="edad-8-mas">+8 años</button>
                        </div>
                    </div>

                    <div class="filtro_fila">
                        <p>Tamaño</p>
                        <div class="lista-catalogo">
                            <button id="chico">Chico</button>
                            <button id="mediano">Mediano</button>
                            <button id="grande">Grande</button>
                        </div>
                    </div>

                    <div class="filtro_fila">
                        <p>Genero</p>
                        <div class="lista-catalogo">
                            <button id="macho">Macho</button>
                            <button id="hembra">Hembra</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="lateral_dr">
                <div class="animal">
                    <img src="img/perro_adopcion.jpg" alt="Foto del animal para adoptar">
                    <h2>Terry</h2>
                    <a href="detalle.html" class="boton_catalogo">Conoceme</a>
                </div>

                <div class="animal">
                    <img src="img/perro_adopcion_2.jpg" alt="Foto del animal para adoptar">
                    <h2>Luna</h2>
                    <a href="detalle.html" class="boton_catalogo">Conoceme</a>
                </div>

                <div class="animal">
                    <img src="img/perro_adopcion_3.jpg" alt="Foto del animal para adoptar">
                    <h2>Max</h2>
                    <a href="detalle.html" class="boton_catalogo">Conoceme</a>
                </div>

                <div class="animal">
                    <img src="img/perro_adopcion_4.jpg" alt="Foto del animal para adoptar">
                    <h2>Terry</h2>
                    <a href="detalle.html" class="boton_catalogo">Conoceme</a>
                </div>

                <div class="animal">
                    <img src="img/perro_adopcion_5.jpg" alt="Foto del animal para adoptar">
                    <h2>Luna</h2>
                    <a href="detalle.html" class="boton_catalogo">Conoceme</a>
                </div>

                <div class="animal">
                    <img src="img/perro_adopcion_6.jpg" alt="Foto del animal para adoptar">
                    <h2>Max</h2>
                    <a href="detalle.html" class="boton_catalogo">Conoceme</a>
                </div>

            </div>
        </div>
    </main>
    <!-- main con un estilo general para que se vea-->
    <footer class="pie">
        <p>© 2026 Huellas a Casa | Refugio animal 🐾</p>
        <p>Cada huella merece encontrar un hogar.</p>
    </footer>
    <!-- footer con la informacion del refugio-->

</body>

</html>
