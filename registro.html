<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellas a casa</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <header class="cabecera">
        <div class="cabecera-contenido">
            <a href="index.html"><img src="img/logo.svg" alt="Huellas a casa" id="logo"></a>
            <nav>
                <ul class="menu">
                    <li class="lista"><a href="index.html">Adoptar</a></li>
                    <li class="lista"><a href="turnos.html">Donar</a></li>
                    <li class="lista"><a href="nuevo_turno.html">Contactos</a></li>
                    <li class="lista"><a href="servicios.html"><img src="img/perfil.svg" alt="Perfil" id="perfil"></a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main>

     <main>
        <div class="login-contenido registro-contenido">
            <form action="#" method="post">
                <legend>Crear Cuenta</legend>

                <p>
                    <label for="correo">Correo electrónico</label><br>
                    <input type="email" id="correo" name="correo" required>
                </p>

                <p>
                    <label for="nombre">Nombre</label><br>
                    <input type="text" id="nombre" name="nombre" required>
                </p>

                <p>
                    <label for="apellido">Apellido</label><br>
                    <input type="text" id="apellido" name="apellido" required>
                </p>

                <p>
                    <label for="telefono">Número de teléfono</label><br>
                    <input type="tel" id="telefono" name="telefono" required>
                </p>

                <p>
                    <label for="fecha_nacimiento">Fecha de nacimiento</label><br>
                    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                </p>

                <p>
                    <label for="dni">DNI</label><br>
                    <input type="number" id="dni" name="dni" required>
                </p>

                <p>
                    <label for="contraseña">Contraseña</label><br>
                    <input type="password" id="contraseña" name="contraseña" required>
                </p>

                <button type="submit">Registrarse</button>
            </form>

            <a href="login.html" class="boton-regis">Iniciar sesión</a>
        </div>
    </main>
</main>
    <footer class="pie">
        <p>© 2026 Huellas a Casa | Refugio animal 🐾</p>
        <p>Cada huella merece encontrar un hogar.</p>
    </footer>

</body>

</html>
