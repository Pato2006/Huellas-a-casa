<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellas a casa</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <header class="cabecera">
        <div class="cabecera-contenido">
            <a href="index.html"><img src="img/logo.svg" alt="Huellas a casa" id="logo"></a>
            <nav>
                <ul class="menu">
                    <li class="lista"><a href="catalogo.html">Adoptar</a></li>
                    <li class="lista"><a href="formulario_donar.html">Donar</a></li>
                    <li class="lista"><a href="contacto.html">Contactos</a></li>
                    <li class="lista"><a href="perfil.html"><img src="img/perfil.svg" alt="Perfil" id="perfil"></a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main>

        <div class="login-contenido">
            <form action="#" method="post" id="registro">
                <legend>Crear Cuenta</legend>

                <p>
                    <label for="correo">Correo electrónico</label><br>
                    <input type="email" id="correo" name="correo">
                    <small id="error-correo"></small>
                </p>

                <p>
                    <label for="nombre">Nombre</label><br>
                    <input type="text" id="nombre" name="nombre">
                    <small id="error-nombre"></small>
                </p>

                <p>
                    <label for="apellido">Apellido</label><br>
                    <input type="text" id="apellido" name="apellido">
                    <small id="error-apellido"></small>
                </p>

                <p>
                    <label for="telefono">Número de teléfono</label><br>
                    <input type="tel" id="telefono" name="telefono">
                    <small id="error-telefono"></small>
                </p>

                <p>
                    <label for="fecha-nacimiento">Fecha de nacimiento</label><br>
                    <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">
                    <small id="error-fecha-nacimiento"></small>
                </p>

                <p>
                    <label for="dni">DNI</label><br>
                    <input type="number" id="dni" name="dni">
                    <small id="error-dni"></small>
                </p>

                <p>
                    <label for="contraseña">Contraseña</label><br>
                    <input type="password" id="contraseña" name="contraseña">
                    <small id="error-contraseña"></small>
                </p>

                <button type="submit">Registrarse</button>
            </form>
            <p id="mensaje-formulario" aria-live="polite"></p>
            <a href="login.html" class="boton-regis">Iniciar sesión</a>
        </div>

    </main>
    <footer class="pie">
        <p>© 2026 Huellas a Casa | Refugio animal 🐾</p>
        <p>Cada huella merece encontrar un hogar.</p>
    </footer>
    <script src="js/registro.js"></script>
</body>

</html>
