<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellas a casa</title>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <header class="cabecera">
        <div class="cabecera-contenido">
            <a href="index.html"><img src="img/logo.svg" alt="Huellas a casa" id="logo"></a>
            <nav>
                <ul class="menu">
                    <li class="lista"><a href="catalogo.html">Adoptar</a></li>
                    <li class="lista"><a href="formulario_donar.html">Donar</a></li>
                    <li class="lista"><a href="contacto.html">Contactos</a></li>
                    <li class="lista"><a href="perfil.html"><img src="img/perfil.svg" alt="Perfil" id="perfil"></a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="contenedor">
            <h1>Formulario de adopcion</h1>
            <!-- comienzo del formulario-->
            <form action="" method="" class="formulario">
                <!-- comienzan las preguntas-->
                <div class="columna">
                    <label for="familia" class="texto">Grupo familiar</label><br>
                    <input type="text" name="familia" required>
                </div>
                <div class="columna">
                    <label for="info_familia" class="texto">¿Alguno de los integrantes de tu casa tiene alergias?
                        ¿Cuales?</label><br>
                    <input type="text" name="info_familia" required>
                </div>
                <div class="columna">
                    <label for="info_mascotas" class="texto">¿Tenes otras mascotas?¿Cuales y que edad
                        tienen?</label><br>
                    <input type="text" name="info_mascotas" required>
                </div>
                <div class="columna">
                    <span class="texto">Que animal es?</span><br>
                    <input type="radio" name="tipo" value="perro" required>
                    <label for="perro" class="texto">Perro</label>
                    <input type="radio" name="tipo" value="gato">
                    <label for="gato" class="texto">Gato</label>
                </div>
                <div class="columna">
                    <label for="cuidado_mascota" class="texto">¿Quien puede cuidarlo en caso de ausentarte?</label><br>
                    <input type="text" name="cuidado_mascota" required>
                </div>

                <div class="columna">
                    <label for="tiempo_solo_mascota" class="texto">¿Cuanto tiempo va a estar el animal solo?</label><br>
                    <input type="text" name="tiempo_solo_mascota" required>
                </div>
                <div class="columna">
                    <label for="localidad_dueno" class="texto">¿Donde vivis?</label><br>
                    <input type="text" name="localidad_dueno" required>
                </div>
                <!-- terminan las preguntas-->
                <!-- botones de accion-->
                <div class="botonera">
                    <button type="submit" class="boton-form">Enviar propuesta</button>
                    <button type="reset" class="boton-form">Limpiar formulario</button>
                </div>
            </form>
            <p>Importante: Este formulario sera revidaso y puede ser aprobado o desaprobado, completarlo no garantiza la
                adopcion</p>
            <!-- aclaracion-->
        </div>
    </main>
    <footer class="pie">
        <p>© 2026 Huellas a Casa | Refugio animal 🐾</p>
        <p>Cada huella merece encontrar un hogar.</p>
    </footer>

</body>

</html>
