<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellas a casa</title>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- es igual al layout usuario solo cambia los <a> del menu-->
</head>

<body>
    <header class="cabecera">
        <div class="cabecera-contenido">
            <a href="index.html"><img src="img/logo.svg" alt="Huellas a casa" id="logo"></a>
            <nav>
                <ul class="menu">
                    <li class="lista"><a href="catalogo_admin.html">Catalogo</a></li>
                    <li class="lista"><a href="cargar_animales.html">Cargar animales</a></li>
                    <li class="lista"><a href="ver_formulario_adopcion_admin.html">Ver adopciones</a></li>
                    <li class="lista"><a href="formulario_donar_admin.html">Ver donaciones</a></li>
                    <li class="lista"><a href="perfil.html"><img src="img/perfil.svg" alt="Perfil" id="perfil"></a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="contenedor">
            <h1>Cargar Animal</h1>
            <!-- comienzo del formulario-->
            <form action="" method="" id="cargar" class="formulario">
                <!-- comienzan las preguntas-->
                <div class="columna">
                    <label for="nombre" class="texto">Nombre</label><br>
                    <input type="text" id="nombre" name="nombre">
                    <small id="error-nombre"></small>
                </div>

                <div class="columna">
                    <label for="edad" class="texto">Edad</label><br>
                    <input type="text" id="edad" name="edad">
                    <small id="error-edad"></small>
                </div>

                <div class="columna">
                    <label for="peso" class="texto">Peso</label><br>
                    <input type="text" id="peso" name="peso">
                    <small id="error-peso"></small>
                </div>

                <div class="columna">
                    <label for="personalidad" class="texto">Personalidad</label><br>
                    <input type="text" id="personalidad" name="personalidad">
                    <small id="error-personalidad"></small>
                </div>
                <div class="columna">
                    <label for="descripcion" class="texto">Descripcion</label><br>
                    <textarea name="descripcion" id="descripcion" required></textarea>
                    <small id="error-descripcion"></small>
                </div>
                    <div class="columna">
                        <span class="texto">Tipo</span><br>

                        <input type="radio" name="tipo" value="perro" required>
                        <label for="perro" class="texto">Perro</label>

                        <input type="radio" name="tipo" value="gato">
                        <label for="gato" class="texto">Gato</label>
                        <small id="error-tipo"></small>
                    </div>

                <div class="columna">
                    <span class="texto">¿Estan castrados?</span><br>
                    <input type="radio" id="castrado-si" name="castrado" value="si">
                    <label for="castrado-si" class="texto">Si</label>
                    <input type="radio" id="castrado-no" name="castrado" value="no">
                    <label for="castrado-no" class="texto">No</label>
                    <small id="error-castrado"></small>
                </div>


                <div class="columna boton_file">
                    <label for="comprobante" class="texto">
                        <input type="file" id="comprobante" name="comprobante" hidden>
                        Foto del animal
                    </label><br>
                    <small id="error-comprobante"></small>
                </div>

                <!-- terminan las preguntas-->
                <!-- botones de accion-->
                <div class="botonera">
                    <button type="submit" class="boton-form">Cargar Animal</button>
                    <button type="reset" class="boton-form">Limpiar formulario</button>
                </div>
            </form>
            <p id="mensaje-formulario" aria-live="polite"></p>
        </div>
    </main>
    <!-- footer igual-->
    <footer class="pie">
        <p>© 2026 Huellas a Casa | Refugio animal 🐾</p>
        <p>Cada huella merece encontrar un hogar.</p>
    </footer>
    <script src="js/cargar_animales.js"></script>
</body>

</html>
