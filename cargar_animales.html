<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellas a casa</title>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- es igual al layout usuario solo cambia los <a> del menu-->
</head>

<body>
    <!-- cabecera con navbar-->
    <header class="cabecera">
        <div class="cabecera-contenido">
            <a href="index.html"><img src="img/logo.svg" alt="Huellas a casa" id="logo"></a>
            <nav>
                <ul class="menu">
                    <!-- cambia las opciones del menu al ser admin-->
                    <li class="lista"><a href="catalogo.html">Catalogo</a></li>
                    <li class="lista"><a href="cargar_animales.html">Cargar animales</a></li>
                    <li class="lista"><a href="ver_formulario_adopcion_admin.html">Ver adopciones</a></li>
                    <li class="lista"><a href="formulario_donar_admin.html">Ver donaciones</a></li>
                    <li class="lista"><a href="perfil.html"><img src="img/perfil.svg" alt="Perfil" id="perfil"></a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main> <!-- Borrar el style, es para ejemplo-->
        <div class="contenedor">
            <h1>Cargar Animal</h1>
            <!-- comienzo del formulario-->
            <form action="" method="" class="formulario">
                <!-- comienzan las preguntas-->
                <div class="columna">
                    <label for="nombre" class="texto">Nombre</label><br>
                    <input type="text" name="nombre" required>
                </div>

                <div class="columna">
                    <label for="edad" class="texto">Edad</label><br>
                    <input type="text" name="edad" required>
                </div>

                <div class="columna">
                    <label for="peso" class="texto">Peso</label><br>
                    <input type="text" name="peso" required>
                </div>

                <div class="columna">
                    <label for="personalidad" class="texto">Personalidad</label><br>
                    <input type="text" name="personalidad" required>
                </div>

                <div class="columna">
                    <span class="texto">¿Estan castrados?</span><br>
                    <input type="radio" name="castrado" value="si" required>
                    <label for="True" class="texto">Si</label>
                    <input type="radio" name="castrado" value="no">
                    <label for="False" class="texto">No</label>
                    <input type="radio" name="castrado" value="no">
                    <label for="False" class="texto">No tengo mascotas</label>
                </div>

                <div class="columna boton_file">
                    <label for="comprobante" class="texto">
                        <input type="file" id="comprobante" name="comprobante" hidden>
                        Foto del animal
                    </label><br>
                </div>

                <!-- terminan las preguntas-->
                <!-- botones de accion-->
                <div class="botonera">
                    <button type="submit" class="boton-form">Cargar Animal</button>
                    <button type="reset" class="boton-form">Limpiar formulario</button>
                </div>
            </form>
        </div>
    </main>
    <!-- footer igual-->
    <footer class="pie">
        <p>© 2026 Huellas a Casa | Refugio animal 🐾</p>
        <p>Cada huella merece encontrar un hogar.</p>
    </footer>

</body>

</html>
